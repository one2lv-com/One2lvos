<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One2lvOS Web Environment</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for beautiful icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* High-quality default wallpaper */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            user-select: none;
        }

        /* Custom scrollbar for inner windows */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .window {
            transition: width 0.2s, height 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .window.maximized {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ── Breathing desktop ─────────────────────────────────────────────
           Icons and windows rise and fall slowly, like a chest: a few percent
           bigger on the in-breath, back on the out-breath, with a slight 3D
           tilt, a glyph that swells a little more than its tile (depth), and a
           faint sheen that drifts across at the top of each breath.
           Pure CSS: no network, no API, no timers. Lives under body.o2-breathe,
           which the lungs button in the taskbar turns on and off. Off by default
           when the device asks for reduced motion. */
        @keyframes o2-breathe-tile {
            0%, 100% { scale: 1;     rotate: 1 -1 0 -2.5deg; }
            50%      { scale: 1.045; rotate: 1 -1 0  2.5deg; }
        }
        @keyframes o2-breathe-glyph {
            0%, 100% { scale: 1; }
            50%      { scale: 1.07; }
        }
        @keyframes o2-breathe-soft {
            0%, 100% { scale: 1; }
            50%      { scale: 1.04; }
        }
        @keyframes o2-breathe-sheen {
            0%   { transform: translateX(-130%) skewX(-20deg); opacity: 0; }
            35%  { opacity: 0; }
            50%  { opacity: 1; }
            65%  { opacity: 0; }
            100% { transform: translateX(130%) skewX(-20deg); opacity: 0; }
        }
        @keyframes o2-breathe-win {
            0%, 100% { scale: 1; }
            50%      { scale: 1.004; }
        }
        @keyframes o2-breathe-aura {
            0%, 100% { opacity: 0.15; }
            50%      { opacity: 0.75; }
        }

        /* Rhythm per icon: five phases and three slightly different lengths, so
           the icons drift in and out of step like a room of sleepers, never in
           lockstep. */
        #desktop-icons > div { --o2-t: 7.6s; --o2-d: 0s; }
        #desktop-icons > div:nth-child(3n+2) { --o2-t: 8.2s; }
        #desktop-icons > div:nth-child(3n)   { --o2-t: 7.1s; }
        #desktop-icons > div:nth-child(5n+2) { --o2-d: -1.5s; }
        #desktop-icons > div:nth-child(5n+3) { --o2-d: -3s; }
        #desktop-icons > div:nth-child(5n+4) { --o2-d: -4.5s; }
        #desktop-icons > div:nth-child(5n)   { --o2-d: -6s; }
        #start-menu-grid > div { --o2-d: 0s; }
        #start-menu-grid > div:nth-child(4n+2) { --o2-d: -2s; }
        #start-menu-grid > div:nth-child(4n+3) { --o2-d: -4s; }
        #start-menu-grid > div:nth-child(4n)   { --o2-d: -6s; }

        /* Desktop icons: tile breathes and tilts, glyph swells deeper, sheen drifts. */
        body.o2-breathe #desktop-icons > div { perspective: 420px; }
        body.o2-breathe #desktop-icons > div > div:first-child {
            position: relative;
            overflow: hidden;
            animation: o2-breathe-tile var(--o2-t) ease-in-out var(--o2-d) infinite;
        }
        body.o2-breathe #desktop-icons > div > div:first-child > i {
            animation: o2-breathe-glyph var(--o2-t) ease-in-out var(--o2-d) infinite;
        }
        body.o2-breathe #desktop-icons > div > div:first-child::after {
            content: '';
            position: absolute;
            inset: -20% 10%;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.32), rgba(165,243,252,0.22), transparent);
            animation: o2-breathe-sheen var(--o2-t) ease-in-out var(--o2-d) infinite;
        }

        /* Start menu and taskbar: the glyphs breathe gently. The taskbar rebuilds
           its buttons often, so --o2-sync (set from the clock below) keeps them
           on the same breath instead of restarting it. */
        body.o2-breathe #start-menu-grid > div > div:first-child > i {
            animation: o2-breathe-soft 7.6s ease-in-out var(--o2-d) infinite;
        }
        body.o2-breathe #taskbar-apps > button > i:first-child {
            animation: o2-breathe-glyph 7.6s ease-in-out var(--o2-sync, 0s) infinite;
        }

        /* Windows: the frame barely swells (0.4%) and a soft inner glow along
           the edge brightens and dims with each breath. Maximized windows keep
           still and only glow, so nothing pokes past the screen edge. */
        body.o2-breathe .window:not(.maximized) {
            animation: o2-breathe-win 9s ease-in-out infinite;
        }
        body.o2-breathe .window:nth-child(odd):not(.maximized),
        body.o2-breathe .window:nth-child(odd)::after { animation-delay: -4.5s; }
        body.o2-breathe .window::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            z-index: 60;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55), inset 0 0 22px rgba(125,211,252,0.28);
            animation: o2-breathe-aura 9s ease-in-out infinite;
        }
    </style>
</head>
<body class="text-gray-800 w-screen h-screen flex flex-col relative">

    <!-- Desktop Area -->

            </div>
            <div class="grid grid-cols-4 gap-y-6 gap-x-2" id="start-menu-grid"></div>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-300/50 flex justify-between items-center bg-white/30 -mx-6 -mb-6 px-6 py-4 rounded-b-2xl">
            <div class="flex items-center gap-3 cursor-pointer hover:bg-white/60 p-1.5 pr-4 rounded-lg transition-colors">
                <img src="https://ui-avatars.com/api/?name=One2lvOS&background=3b82f6&color=fff&rounded=true" alt="User" class="w-8 h-8 rounded-full shadow-sm">
                <span class="text-sm font-medium text-gray-800">Administrator</span>
            </div>
            <button class="w-10 h-10 rounded-lg hover:bg-white/60 flex items-center justify-center transition-colors text-gray-700 hover:text-red-600">
                <i class="fas fa-power-off text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Taskbar -->
    <nav id="taskbar" class="h-14 bg-black/40 backdrop-blur-xl border-t border-white/10 flex items-center justify-between px-3 z-50 relative shadow-[0_-5px_20px_rgba(0,0,0,0.1)]">
        <div class="flex items-center gap-1.5 h-full">
            <button id="start-btn" onclick="toggleStartMenu()" class="w-10 h-10 rounded-lg hover:bg-white/10 flex items-center justify-center transition-all group active:scale-95">
                <div class="text-[22px] text-blue-400 group-hover:text-blue-300 transition-colors drop-shadow-md">
                    <i class="fab fa-windows"></i>
                </div>
            </button>

            <div class="w-px h-6 bg-white/20 mx-1"></div>

            <div id="taskbar-apps" class="flex gap-1.5 items-center h-full"></div>
        </div>

        <div class="flex items-center gap-2 h-full text-white">
            <!-- Breathing desktop on/off -->
            <button id="o2-breathe-btn" onclick="o2ToggleBreathe()" title="Breathing icons" aria-pressed="true" class="w-10 h-10 rounded-lg hover:bg-white/10 flex items-center justify-center transition-all group active:scale-95">
                <i class="fas fa-lungs text-sm text-cyan-300 group-hover:text-cyan-200 drop-shadow-sm transition-colors"></i>
            </button>

                <i class="fas fa-camera text-sm text-blue-300 group-hover:text-blue-200 drop-shadow-sm transition-colors"></i>
            </button>
            <button onclick="loadStatePNG()" title="Load desktop state from PNG" class="w-10 h-10 rounded-lg hover:bg-white/10 flex items-center justify-center transition-all group active:scale-95">
                <i class="fas fa-folder-open text-sm text-green-300 group-hover:text-green-200 drop-shadow-sm transition-colors"></i>
            </button>
            <div class="w-px h-6 bg-white/20"></div>
            <div class="flex items-center gap-3 hover:bg-white/10 px-3 py-1.5 rounded-lg cursor-pointer transition-colors h-10">

                <i class="fas fa-volume-up text-sm text-gray-100"></i>
                <i class="fas fa-battery-three-quarters text-sm text-gray-100"></i>

            <div class="hover:bg-white/10 w-10 h-10 rounded-lg cursor-pointer transition-colors flex items-center justify-center relative">
                <i class="far fa-bell text-gray-100"></i>
                <div class="absolute top-2.5 right-2 w-2 h-2 bg-blue-500 rounded-full border border-gray-800"></div>
            </div>
        </div>
    </nav>

        const O2_DOMAIN   = 'one2lv.com';
        const O2_WS       = (p) => (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + p;
        const O2_PUB      = (sub) => 'https://' + sub + '.' + O2_DOMAIN;
        const ARCADE      = '/svc/arcade';     // AI Arcade MCP (:8003)
        const GW          = '/svc/gateway';    // Unified Gateway (:8888, not installed)
        const LOBBY       = '/svc/lobby';      // AI Lobby (:8006)
        const LUMENIS_RC  = '';                // Lumenis Reactor Core (:8000) — this origin
        const SOVEREIGN   = '/svc/core';       // Sovereign Agentic Core (:8081)
        const OS_CORE     = '/svc/oscore';     // One2lvOS Core (:3002, not installed)
        const WITNESS     = '/svc/witness';    // Minimax Witness Proxy (:3001, not installed)
        const MINIMAX     = '/svc/minimax';    // Minimax Core API (:8080)
        const STEAMOS     = '/svc/steamos';    // SteamOS Lumenis v7 (:8005, not installed)
        const AETHERIX    = O2_PUB('aetherix'); // Aetherix Terminal (:9003) — own endpoint for its UI
        const AETHERIX_API = '/svc/aetherix';
        const LUMENIS_OS  = '/svc/lumenisos';  // LumenisOS API (:9002, not installed)
        const LUMENIS_UI  = '/svc/spaceui';    // Lumenis Space Agent UI (:9001, not installed)
        const LUMENIS_V7  = '/svc/steamos';    // Lumenis v7 Cosmic (:8005, not installed)

        const IH = { tab: 'status', proto: 'webdav', path: '/', data: null, timers: [] };
        const ihEsc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

        async function ihJson(url, opts) {
            const r = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts || {}));
            let body = null; try { body = await r.json(); } catch (e) {}
            if (!r.ok) throw new Error((body && (body.detail || body.error || (body.error && body.error.message))) || ('HTTP ' + r.status));
            return body;
        }

        // One2lvOS Terminal Commands
        async function handleOne2lvTerminal(e) {
            if(e.key !== 'Enter') return;

            const input = e.target;
            const cmd = input.value.trim();
            const output = document.getElementById('one2lv-output');

            // Echo command
            const cmdLine = document.createElement('div');
            cmdLine.className = 'mb-2';
            cmdLine.innerHTML = `<span class="text-blue-400">one2lv@OS:~$</span> <span class="text-white">${cmd}</span>`;
            output.appendChild(cmdLine);

            input.value = '';

            if (!cmd) return;

            const parts = cmd.split(/\s+/);
            const mainCmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            let response = '';

            try {
                if (mainCmd === 'help') {
                    response = `<div class="text-cyan-400">One2lvOS Terminal Commands:</div>
<div class="text-gray-300 mt-2">
  help          - Show this message
  status        - Show service status
  services      - List all services
  version       - System version
  arcade [cmd]  - AI Arcade (info, list, leaderboard)
  clear         - Clear terminal
  date          - Show current date
  whoami        - Show current user
  steam         - Open the Steam Community window (links to Valve's sites)
</div>`;
                } else if (mainCmd === 'status') {
                    response = '<div class="text-yellow-400">Checking services...</div>';
                    const services = await checkAllServices();
                    response = `<div class="text-cyan-400">One2lvOS Service Status:</div>\n${services}`;
                } else if (mainCmd === 'services') {
                    response = `<div class="text-cyan-400">One2lvOS Services:</div>
<div class="text-gray-300 mt-2">
  Lumenis Reactor  - Port 8000  (FastAPI + WS, ITT Council)
  Witness Proxy    - Port 3001  (Minimax NVIDIA NIM proxy)
  One2lvOS Core    - Port 3002  (Flask core)
  Sovereign Core   - Port 3003  (FastAPI control-plane)
  AI Arcade MCP    - Port 8003  (Python MCP server)
  Lumenis v7       - Port 8005  (Node.js Cosmic)
  AI Lobby         - Port 8006  (Agent hub/registry)
  Minimax Core     - Port 8080  (Node.js minimax/minimax-01)
  Unified Gateway  - Port 8888  (FastAPI gateway)
  Lumenis UI       - Port 9001  (Static frontend)
  LumenisOS API    - Port 9002  (Node.js API server)
  Aetherix         - Port 9003  (Master terminal)
</div>`;
                } else if (mainCmd === 'steam') {
                    openApp('steamos-dash');
                    response = '<div class="text-gray-300">Opened Steam Community. Its links open steamcommunity.com and store.steampowered.com in a new tab. This does not install Steam, run SteamOS or stream games.</div>';
                } else if (mainCmd === 'version') {
                    response = `<div class="text-cyan-400">One2lvOS Version 2.0.0</div>
<div class="text-gray-400">AI-Powered Spatial Computing OS</div>
<div class="text-gray-500">Hosted: https://one2lv.com/OS</div>`;
                } else if (mainCmd === 'arcade') {
                    const subcmd = args[0] || 'info';
                    response = '<div class="text-yellow-400">Contacting AI Arcade...</div>';
                    const res = await arcadeAPI(subcmd);
                    response = `<div class="text-green-400">${res}</div>`;
                } else if (mainCmd === 'clear') {
                    output.innerHTML = '';
                    return;
                } else if (mainCmd === 'date') {
                    response = '<div class="text-gray-300">' + new Date().toString() + '</div>';
                } else if (mainCmd === 'whoami') {
                    response = '<div class="text-gray-300">Administrator</div>';
                } else if (cmd) {
                    response = `<div class="text-red-400">Command not found: ${mainCmd}</div>`;
                }
            } catch (err) {
                response = `<div class="text-red-400">Error: ${err.message}</div>`;
            }

            const resLine = document.createElement('div');
            resLine.className = 'mb-3';
            resLine.innerHTML = response;
            output.appendChild(resLine);
            output.scrollTop = output.scrollHeight;
        }

        // AI Arcade API calls
        async function arcadeAPI(cmd) {
            try {
                const toolMap = {
                    'info': 'arcade_info',
                    'list': 'list_games',
                    'leaderboard': 'get_leaderboard',
                    'library': 'library_list'
                };

                const tool = toolMap[cmd] || 'arcade_info';
                const res = await fetch(`${ARCADE}/mcp`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: Date.now(),
                        method: 'tools/call',
                        params: {name: tool, arguments: {}}
                    })
                });

                const data = await res.json();
                return data?.result?.content?.[0]?.text || 'No response';
            } catch (err) {
                return `Error: ${err.message}`;
            }
        }

        function makeDraggable(win, header) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            header.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.window-controls')) return;
                isDragging = true;
                bringToFront(win.id.replace('window-', ''));
                startX = e.clientX;
                startY = e.clientY;
                initialX = win.offsetLeft;
                initialY = win.offsetTop;
                header.setPointerCapture(e.pointerId);
            });

            header.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                win.style.left = `${initialX + dx}px`;
                win.style.top = `${Math.max(0, initialY + dy)}px`;
            });

            header.addEventListener('pointerup', (e) => {
                isDragging = false;
                header.releasePointerCapture(e.pointerId);
            });
        }

            const tbApps = document.getElementById('taskbar-apps');

                const app = apps[appId];
                const win = document.getElementById(`window-${appId}`);
                if (!win) return;

                const isHidden = win.classList.contains('opacity-0');
                const isTop = win.style.zIndex == highestZ && !isHidden;

                const btn = document.createElement('button');
                btn.className = `w-11 h-11 rounded-lg flex items-center justify-center transition-all ${isTop ? 'bg-white/20 shadow-inner' : 'hover:bg-white/10'} group relative`;

                btn.onclick = () => {
                    if (isHidden) {
                        win.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                        bringToFront(appId);
                    } else {
                        if (isTop) {
                            minimizeApp(appId);
                        } else {

                        }
                    }

                };

                btn.innerHTML = `
                    <i class="${app.icon} ${app.color} text-[22px] drop-shadow-sm transition-transform group-active:scale-90"></i>
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3.5 h-1 rounded-t-sm ${isTop ? 'bg-blue-400' : 'bg-gray-400'} shadow transition-all"></div>

        window.calcInput = function(val) {
            const display = document.getElementById('calc-display');
            if(display.innerText === '0' || display.dataset.clearNext === 'true') {
                display.innerText = val;
                display.dataset.clearNext = 'false';
            } else {
                display.innerText += val;
            }
        };

        window.calcOp = function(op) {
            const display = document.getElementById('calc-display');
            const history = document.getElementById('calc-history');

            if (op === 'C') {
                display.innerText = '0';
                history.innerText = '';
                display.dataset.val1 = '';
                display.dataset.op = '';
            } else if (op === 'DEL') {
                if(display.dataset.clearNext === 'true') return;
                display.innerText = display.innerText.length > 1 ? display.innerText.slice(0, -1) : '0';
            } else if (op === '=') {
                if (display.dataset.op && display.dataset.val1) {
                    try {
                        const v1 = parseFloat(display.dataset.val1);
                        const v2 = parseFloat(display.innerText);
                        let res = 0;
                        switch(display.dataset.op) {
                            case '+': res = v1 + v2; break;
                            case '-': res = v1 - v2; break;
                            case '×': res = v1 * v2; break;
                            case '÷': res = v1 / v2; break;
                        }
                        history.innerText = `${v1} ${display.dataset.op} ${v2} =`;
                        let resStr = res.toString();
                        if(resStr.length > 12) resStr = res.toPrecision(10);
                        display.innerText = resStr;
                    } catch(e) {
                        display.innerText = 'Error';
                    }
                    display.dataset.clearNext = 'true';
                    display.dataset.op = '';
                }
            } else {
                display.dataset.val1 = display.innerText;
                display.dataset.op = op;
                history.innerText = `${display.innerText} ${op}`;
                display.dataset.clearNext = 'true';
            }
        }

        async function netFilesDownload(path) {
            netFilesStatus('Downloading…');
            try {
                const blob = await (await netFilesCall('get', null, path)).blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = path.split('/').filter(Boolean).pop() || 'download';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 10000);
                netFilesStatus('Downloaded ' + a.download);
            } catch (e) { netFilesStatus('Download failed: ' + e.message, true); }
        }
        async function netFilesUpload(input) {
            const files = Array.from(input.files || []);
            input.value = '';
            for (const f of files) {
                if (f.size > 50 * 1024 * 1024) { netFilesStatus(f.name + ' is over the 50 MB upload limit', true); continue; }
                netFilesStatus('Uploading ' + f.name + '…');
                try {
                    await netFilesCall('put', { method: 'PUT', headers: { 'Content-Type': 'application/octet-stream' }, body: f }, netJoin(_netFiles.path, f.name));
                } catch (e) { netFilesStatus('Upload of ' + f.name + ' failed: ' + e.message, true); return; }
            }
            await netFilesLoad();
            if (files.length) netFilesStatus('Uploaded ' + files.length + ' file' + (files.length === 1 ? '' : 's'));
        }
        async function netFilesMkdir() {
            const name = (prompt('New folder name:') || '').trim();
            if (!name) return;
            if (/[\/]/.test(name) || name === '.' || name === '..') { netFilesStatus('Folder names cannot contain / or be . or ..', true); return; }
            try {
                await netFilesCall('mkdir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: netJoin(_netFiles.path, name) }) });
                netFilesLoad();
            } catch (e) { netFilesStatus('Could not create folder: ' + e.message, true); }
        }
        async function netFilesRename(path) {
            const old = path.split('/').filter(Boolean).pop();
            const name = (prompt('Rename to:', old) || '').trim();
            if (!name || name === old) return;
            if (/[\/]/.test(name) || name === '.' || name === '..') { netFilesStatus('Names cannot contain / or be . or ..', true); return; }
            const dir = path.replace(/\/[^\/]*\/?$/, '') || '/';
            try {
                await netFilesCall('move', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: path, to: netJoin(dir, name) }) });
                netFilesLoad();
            } catch (e) { netFilesStatus('Rename failed: ' + e.message, true); }
        }
        async function netFilesDelete(path, isDir) {
            if (!confirm('Delete ' + (isDir ? 'folder ' : '') + path + (isDir ? ' and everything in it' : '') + '?')) return;
            try {
                await netFilesCall('delete', { method: 'DELETE' }, path);
                netFilesLoad();
            } catch (e) { netFilesStatus('Delete failed: ' + e.message, true); }
        }

        // ── PNG State Save / Load ────────────────────────────────────────

        // CRC32 lookup table (required for PNG chunk integrity)
        const _crc32Table = (() => {
            const t = new Uint32Array(256);
            for (let i = 0; i < 256; i++) {
                let c = i;
                for (let j = 0; j < 8; j++) c = (c & 1) ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
                t[i] = c;
            }
            return t;
        })();
        function _crc32(data) {
            let crc = 0xFFFFFFFF;
            for (const b of data) crc = _crc32Table[(crc ^ b) & 0xFF] ^ (crc >>> 8);
            return (crc ^ 0xFFFFFFFF) >>> 0;
        }

        // Collect the current desktop state
        function captureDesktopState() {
            const state = {
                version: '2.0',
                timestamp: Date.now(),
                wallpaper: document.body.style.backgroundImage || '',
                windows: []
            };
            Object.keys(openApps).forEach(appId => {
                const win = document.getElementById(`window-${appId}`);
                if (!win) return;
                state.windows.push({
                    id: appId,
                    x: parseInt(win.style.left) || 0,
                    y: parseInt(win.style.top) || 0,
                    w: parseInt(win.style.width) || (apps[appId] ? apps[appId].width : 600),
                    h: parseInt(win.style.height) || (apps[appId] ? apps[appId].height : 400),
                    minimized: win.classList.contains('opacity-0'),
                    maximized: win.classList.contains('maximized'),
                    zIndex: parseInt(win.style.zIndex) || 10
                });
            });
            return state;
        }

        // Inject a tEXt metadata chunk into an existing PNG byte array
        function _injectPNGtEXt(pngBytes, keyword, text) {
            const enc = new TextEncoder();
            const kw = enc.encode(keyword);
            const tx = enc.encode(text);
            const chunkData = new Uint8Array(kw.length + 1 + tx.length);
            chunkData.set(kw);
            chunkData[kw.length] = 0; // null separator
            chunkData.set(tx, kw.length + 1);

            const typeBytes = new Uint8Array([0x74, 0x45, 0x58, 0x74]); // "tEXt"
            const crcInput = new Uint8Array(4 + chunkData.length);
            crcInput.set(typeBytes);
            crcInput.set(chunkData, 4);
            const crc = _crc32(crcInput);

            const chunk = new Uint8Array(4 + 4 + chunkData.length + 4);
            const dv = new DataView(chunk.buffer);
            dv.setUint32(0, chunkData.length, false);
            chunk.set(typeBytes, 4);
            chunk.set(chunkData, 8);
            dv.setUint32(8 + chunkData.length, crc, false);

            // Insert after IHDR (PNG sig 8 bytes + IHDR chunk 25 bytes = offset 33)
            const insertAt = 33;
            const out = new Uint8Array(pngBytes.length + chunk.length);
            out.set(pngBytes.slice(0, insertAt));
            out.set(chunk, insertAt);
            out.set(pngBytes.slice(insertAt), insertAt + chunk.length);
            return out;
        }

        // Extract a tEXt chunk value by keyword from PNG bytes
        function _extractPNGtEXt(bytes, keyword) {
            const dec = new TextDecoder();
            let offset = 8; // skip 8-byte PNG signature
            while (offset < bytes.length - 12) {
                const dv = new DataView(bytes.buffer, bytes.byteOffset);
                const len = dv.getUint32(offset, false);
                const type = dec.decode(bytes.slice(offset + 4, offset + 8));
                if (type === 'tEXt') {
                    const data = bytes.slice(offset + 8, offset + 8 + len);
                    const nullIdx = data.indexOf(0);
                    if (nullIdx !== -1 && dec.decode(data.slice(0, nullIdx)) === keyword) {
                        return dec.decode(data.slice(nullIdx + 1));
                    }
                }
                if (type === 'IEND') break;
                offset += 12 + len;
            }
            return null;
        }

        // Save current desktop state as a PNG with embedded JSON metadata
        function saveStatePNG() {
            const state = captureDesktopState();
            const stateJSON = JSON.stringify(state);

            // Draw a mini-map of the desktop as the PNG visual
            const canvas = document.createElement('canvas');
            canvas.width = 640; canvas.height = 360;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const grad = ctx.createLinearGradient(0, 0, 640, 360);
            grad.addColorStop(0, '#1e1b4b'); grad.addColorStop(1, '#312e81');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 640, 360);

            // Draw window thumbnails scaled to canvas
            const scaleX = 640 / window.innerWidth;
            const scaleY = 360 / Math.max(window.innerHeight - 56, 1);
            const palette = ['#3b82f6','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444','#ec4899','#14b8a6'];
            state.windows.forEach((w, i) => {
                if (w.minimized) return;
                const col = palette[i % palette.length];
                ctx.fillStyle = col + '55';
                ctx.strokeStyle = col + 'cc';
                ctx.lineWidth = 1.5;
                const rx = Math.max(0, w.x * scaleX), ry = Math.max(0, w.y * scaleY);
                const rw = Math.min(w.w * scaleX, 640 - rx), rh = Math.min(w.h * scaleY, 360 - ry);
                ctx.fillRect(rx, ry, rw, rh);
                ctx.strokeRect(rx, ry, rw, rh);
                // App name label
                ctx.fillStyle = '#ffffff99';
                ctx.font = '10px monospace';
                ctx.fillText(w.id, rx + 4, ry + 14);
            });

            // Header overlay
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(0, 0, 640, 72);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Inter, sans-serif';
            ctx.fillText('One2lvOS Desktop State', 14, 26);
            ctx.font = '11px monospace';
            ctx.fillStyle = '#a5b4fc';
            ctx.fillText(new Date(state.timestamp).toLocaleString(), 14, 45);
            ctx.fillStyle = '#86efac';
            ctx.fillText(`${state.windows.length} window(s) open`, 14, 62);

            // Footer badge
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 330, 640, 30);
            ctx.fillStyle = '#64748b';
            ctx.font = '10px monospace';
            ctx.fillText('one2lvos-state v2.0 · embedded metadata PNG', 14, 349);

            // Get raw PNG bytes, inject tEXt chunk with state JSON
            const dataURL = canvas.toDataURL('image/png');
            const raw = Uint8Array.from(atob(dataURL.split(',')[1]), c => c.charCodeAt(0));
            const pngWithState = _injectPNGtEXt(raw, 'one2lvos-state', stateJSON);

            // Download
            const blob = new Blob([pngWithState], {type: 'image/png'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `one2lvos-state-${state.timestamp}.png`;
            a.click();
            URL.revokeObjectURL(url);

            _showNotif(`State saved — ${state.windows.length} window(s)`, 'fas fa-camera text-blue-400');

            // Also notify Lumenis
            _notifyLumenisSaveState(state);
        }

        // Load state PNG — open file picker, extract JSON, restore desktop
        function loadStatePNG() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/png';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const buf = await file.arrayBuffer();
                const bytes = new Uint8Array(buf);
                const stateJSON = _extractPNGtEXt(bytes, 'one2lvos-state');
                if (!stateJSON) {
                    _showNotif('No One2lvOS state found in this PNG', 'fas fa-exclamation-triangle text-red-400');
                    return;
                }
                try {
                    const state = JSON.parse(stateJSON);
                    _restoreDesktopState(state);
                    _showNotif(`State loaded — ${state.windows.length} window(s) restored`, 'fas fa-folder-open text-green-400');
                } catch(err) {
                    _showNotif('Failed to parse state: ' + err.message, 'fas fa-exclamation-triangle text-red-400');
                }
            };
            input.click();
        }

        // Restore desktop from a saved state object
        function _restoreDesktopState(state) {
            // Close all open windows
            [...Object.keys(openApps)].forEach(id => closeApp(id));
            // Restore wallpaper
            if (state.wallpaper) document.body.style.backgroundImage = state.wallpaper;
            // Reopen windows in z-order
            const sorted = [...state.windows].sort((a, b) => a.zIndex - b.zIndex);
            sorted.forEach((w, i) => {
                setTimeout(() => {
                    if (!apps[w.id]) return;
                    openApp(w.id);
                    requestAnimationFrame(() => {
                        const win = document.getElementById(`window-${w.id}`);
                        if (!win) return;
                        win.style.left = w.x + 'px';
                        win.style.top = Math.max(0, w.y) + 'px';
                        win.style.width = w.w + 'px';
                        win.style.height = w.h + 'px';
                        win.style.zIndex = w.zIndex;
                        if (w.minimized) win.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
                        if (w.maximized) maximizeApp(w.id);
                    });
                }, i * 80);
            });
        }

        // Toast notification helper
        function _showNotif(msg, iconClass = 'fas fa-info-circle text-blue-400') {
            const el = document.createElement('div');
            el.className = 'fixed bottom-20 right-4 bg-white/90 backdrop-blur-xl border border-white/50 shadow-xl rounded-xl px-4 py-3 flex items-center gap-3 z-[9999] transition-all duration-300';
            el.innerHTML = `<i class="${iconClass}"></i><span class="text-sm font-medium text-gray-800">${msg}</span>`;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; setTimeout(() => el.remove(), 300); }, 3500);
        }

        // Tell Lumenis about the saved state
        async function _notifyLumenisSaveState(state) {
            const summary = `Desktop state snapshot saved as PNG. ${state.windows.length} open window(s): ${state.windows.map(w=>w.id).join(', ')}. Timestamp: ${new Date(state.timestamp).toISOString()}. Please store this as a memory fact: the user saved their One2lvOS desktop state.`;
            try {
                // Store as a fact in compass.db via the API
                await fetch(LUMENIS_RC + '/api/facts', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({content: summary, tags: ['desktop-state','png-save']}),
                    signal: AbortSignal.timeout(5000)
                });
            } catch(_) {}
            // Also send a chat message
            try {
                const ws = new WebSocket(O2_WS('/ws'));
                ws.onopen = () => {
                    ws.send(JSON.stringify({action:'chat', message: summary}));
                    setTimeout(() => ws.close(), 5000);
                };
            } catch(_) {}
        }


        // ── Lumenis Chat (native WebSocket) ─────────────────────────────
        let _lcWs = null, _lcSession = null, _lcAiEl = null;

        function lcSetDot(state) {
            const d = document.getElementById('lc-dot');
            if (!d) return;
            const styles = {on:'background:#00ff88;box-shadow:0 0 7px #00ff88', busy:'background:#fcee0a', off:'background:#5a6a88'};
            d.style.cssText = 'width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background .3s;' + (styles[state]||styles.off);
        }

        function lcChip(seat, active) {
            const chips = document.querySelectorAll('#lc-chips .lc-chip');
            chips.forEach(c => {
                if (c.dataset.seat === seat) {
                    if (active) {
                        c.style.borderColor = 'rgba(0,240,255,.6)';
                        c.style.color = '#00f0ff';
                        c.style.background = 'rgba(0,240,255,.07)';
                        c.style.boxShadow = '0 0 7px rgba(0,240,255,.15)';
                    } else {
                        c.style.borderColor = 'rgba(0,240,255,.13)';
                        c.style.color = '#5a6a88';
                        c.style.background = 'transparent';
                        c.style.boxShadow = 'none';
                    }
                }
            });
        }

        function lcAddMsg(role, text) {
            const box = document.getElementById('lc-msgs');
            if (!box) return null;
            const wrap = document.createElement('div');
            const isUser = role === 'user';
            const isSys = role === 'sys';
            wrap.style.cssText = 'display:flex;flex-direction:column;max-width:88%;gap:3px;' +
                (isUser ? 'align-self:flex-end;align-items:flex-end' :
                 isSys  ? 'align-self:center;align-items:center;max-width:100%' :
                          'align-self:flex-start;align-items:flex-start');
            const lbl = document.createElement('div');
            lbl.style.cssText = 'font-size:.62rem;color:#5a6a88;padding:0 3px';
            lbl.textContent = isUser ? 'You' : isSys ? '' : 'Lumenis';
            const bubble = document.createElement('div');
            bubble.style.cssText = 'padding:9px 13px;border-radius:11px;font-size:.855rem;line-height:1.65;word-break:break-word;white-space:pre-wrap;' +
                (isUser ? 'background:rgba(0,240,255,.09);border:1px solid rgba(0,240,255,.25);border-radius:11px 2px 11px 11px' :
                 isSys  ? 'background:rgba(255,0,212,.05);border:1px solid rgba(255,0,212,.18);border-radius:7px;color:#5a6a88;font-size:.72rem;padding:5px 14px;text-align:center' :
                          'background:#160a2e;border:1px solid rgba(0,240,255,.13);border-radius:2px 11px 11px 11px');
            bubble.textContent = text || '';
            if (!isSys) wrap.appendChild(lbl);
            wrap.appendChild(bubble);
            box.appendChild(wrap);
            box.scrollTop = box.scrollHeight;
            return bubble;
        }

        function lcInit() {
            const dot = document.getElementById('lc-dot');
            if (!dot) return; // window not open yet
            if (_lcWs) { try { _lcWs.close(); } catch(_) {} }
            lcSetDot('off');
            _lcWs = null; _lcSession = null; _lcAiEl = null;
            lcAddMsg('sys', 'Connecting to Lumenis Reactor...');
            try {
                _lcWs = new WebSocket(O2_WS('/ws'));
                _lcWs.onopen = () => lcSetDot('on');
                _lcWs.onclose = () => { lcSetDot('off'); setTimeout(() => { if (document.getElementById('lc-dot')) lcAddMsg('sys', 'Disconnected. Click ↺ to reconnect.'); }, 100); };
                _lcWs.onerror = () => lcAddMsg('sys', 'Connection error — is the reactor running? (python3 lumenis-main.py)');
                _lcWs.onmessage = (e) => {
                    let d;
                    try { d = JSON.parse(e.data); } catch(_) { return; }
                    const t = d.type || '';
                    if (t === 'session_created') {
                        _lcSession = d.session_id;
                        const s = document.getElementById('lc-session');
                        if (s) s.textContent = 'session ' + (_lcSession||'').slice(0,8);
                        lcAddMsg('sys', 'Connected — ITT Council of Nine online');
                    } else if (t === 'processing_start') {
                        lcSetDot('busy');
                        const ty = document.getElementById('lc-typing');
                        if (ty) ty.style.display = 'block';
                        _lcAiEl = lcAddMsg('ai', '');
                    } else if (t === 'response_chunk') {
                        const ty = document.getElementById('lc-typing');
                        if (ty) ty.style.display = 'none';
                        if (!_lcAiEl) _lcAiEl = lcAddMsg('ai', '');
                        _lcAiEl.textContent += (d.text || '');
                        const box = document.getElementById('lc-msgs');
                        if (box) box.scrollTop = box.scrollHeight;
                    } else if (t === 'processing_done') {
                        lcSetDot('on');
                        const ty = document.getElementById('lc-typing');
                        if (ty) ty.style.display = 'none';
                        _lcAiEl = null;
                        document.querySelectorAll('#lc-chips .lc-chip').forEach(c => lcChip(c.dataset.seat, false));
                    } else if (t === 'seat_activity') {
                        const seat = d.seat || d.name;
                        if (seat) { lcChip(seat, true); setTimeout(() => lcChip(seat, false), 2000); }
                    }
                };
            } catch(err) { lcAddMsg('sys', 'WebSocket error: ' + err.message); }
        }

        function lcSend() {
            const inp = document.getElementById('lc-inp');
            if (!inp) return;
            const msg = inp.value.trim();
            if (!msg) return;
            if (!_lcWs || _lcWs.readyState !== WebSocket.OPEN) { lcAddMsg('sys', 'Not connected — click ↺'); return; }
            inp.value = '';
            lcAddMsg('user', msg);
            _lcWs.send(JSON.stringify({action:'chat', message: msg, session_id: _lcSession}));
        }

        function lcClear() {
            const box = document.getElementById('lc-msgs');
            if (box) box.innerHTML = '';
        }

        }

        async function onworksSelect(buildId) {
            const b = _owBuilds.find(x => x.id === buildId);
            if (!b) return;
            _owSelected = buildId;

            // Update iframe
            const frame = document.getElementById('ow-frame');
            if (frame) frame.src = b.launch_url;

            // Update header
            onworksUpdateHeader(b);

            // Re-render list with new selection
            onworksRender(_owBuilds, _owSelected, _owFilter);

            // Persist to Lumenis
            try {
                await fetch(`${LUMENIS_RC}/api/resources/onworks/select`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({build_id: buildId})
                });
            } catch(e) {}
        }

        function onworksUpdateHeader(b) {
            const badge = document.getElementById('ow-active-badge');
            const catBadge = document.getElementById('ow-category-badge');
            const urlDisplay = document.getElementById('ow-url-display');
            if (badge) badge.textContent = b.name || b.build_id;
            if (catBadge) catBadge.textContent = b.category || '';
            if (urlDisplay) urlDisplay.textContent = b.launch_url || '';
        }

        function onworksFilter(cat) {
            _owFilter = cat;
            // Update filter button styles
            ['all','ubuntu','debian','rpm','special'].forEach(c => {
                const btn = document.getElementById(`owf-${c}`);
                if (btn) btn.classList.toggle('active-filter', c === cat);
            });
            onworksRender(_owBuilds, _owSelected, cat);
        }

        function onworksOpenTab() {
            const b = _owBuilds.find(x => x.id === _owSelected);
            if (b) window.open(b.launch_url, '_blank');
        }

        function owCopyUrl() {
            const url = document.getElementById('ow-url-display');
            if (!url) return;
            navigator.clipboard.writeText(url.textContent).then(() => {
                const btn = event.target.closest('button');
                if (!btn) return;
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check mr-1 text-green-400"></i>Copied!';
                setTimeout(() => btn.innerHTML = orig, 1400);
            });
        }

                // ── Google API PHP Client helpers ─────────────────────────────────────────
        const PHP_INSTALL_URL = 'https://apis.google.com/additnow/l?applicationid=796898949162&__ls=ogb&__lu=https%3A%2F%2Fwww.onworks.net%2Fthirdparty%2Fgdrive%2Fgoogle-api-php-client%2Fcore%2Fdownload.php';
        const PHP_DL_URL      = 'https://www.onworks.net/thirdparty/gdrive/google-api-php-client/core/download.php';

        async function phpClientProbe() {
            const dot    = document.getElementById('php-dot');
            const status = document.getElementById('php-status');
            const out    = document.getElementById('php-probe-output');
            if (!dot) return;
            dot.style.background = 'rgba(255,255,255,0.5)'; status.textContent = 'Probing…';
            if (out) { out.classList.remove('hidden'); out.textContent = 'Fetching resource info from Lumenis…'; }
            try {
                const r = await fetch(`${LUMENIS_RC}/api/resources/onworks_gdrive_php/info`);
                const d = await r.json();
                dot.style.background = '#22c55e'; status.textContent = 'Available';
                if (out) out.textContent = JSON.stringify(d, null, 2);
                // Populate URL fields
                const instEl = document.getElementById('php-install-url');
                const dlEl   = document.getElementById('php-dl-url');
                if (instEl) instEl.textContent = d.install_url || PHP_INSTALL_URL;
                if (dlEl)   dlEl.textContent   = d.download_url || PHP_DL_URL;
            } catch(e) {
                dot.style.background = '#ef4444'; status.textContent = 'Error';
                if (out) out.textContent = 'Probe error: ' + e.message;
            }
        }

        function phpInstall()     { window.open(PHP_INSTALL_URL, '_blank'); }
        function phpDownload()    { window.open(PHP_DL_URL, '_blank'); }

        function phpCopyInstall() {
            navigator.clipboard.writeText(PHP_INSTALL_URL).then(() => {
                const btn = event.target.closest('button');
                const orig = btn.innerHTML; btn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
                setTimeout(() => btn.innerHTML = orig, 1500);
            });
        }

        function phpCopyDownload() {
            navigator.clipboard.writeText(PHP_DL_URL).then(() => {
                const btn = event.target.closest('button');
                const orig = btn.innerHTML; btn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
                setTimeout(() => btn.innerHTML = orig, 1500);
            });
        }

        // Steam Community app: opens Valve's official store search in a new tab.
        function steamStoreSearch() {
            const el = document.getElementById('steam-search');
            const q = el ? el.value.trim() : '';
            const url = q ? 'https://store.steampowered.com/search/?term=' + encodeURIComponent(q) : 'https://store.steampowered.com/search/';
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        // Initialization
        function initOS() {
            const desktop = document.getElementById('desktop-icons');
            const startGrid = document.getElementById('start-menu-grid');

            Object.keys(apps).forEach(appId => {
                const app = apps[appId];

                const deskIcon = document.createElement('div');
                deskIcon.className = 'w-24 rounded-lg p-2 flex flex-col items-center justify-center cursor-pointer hover:bg-white/10 transition-colors group active:bg-white/20';
                deskIcon.onclick = () => openApp(appId);
                deskIcon.innerHTML = `
                    <div class="w-14 h-14 rounded-xl flex items-center justify-center shadow-[0_4px_15px_rgba(0,0,0,0.1)] mb-2 group-hover:scale-105 transition-transform bg-white/20 backdrop-blur-md border border-white/30">
                        <i class="${app.icon} ${app.color} text-[28px] drop-shadow-md"></i>
                    </div>
                    <span class="text-white text-xs text-center font-medium px-1.5 py-0.5 rounded group-hover:bg-black/30 transition-colors truncate w-full" style="text-shadow: 0 1px 3px rgba(0,0,0,0.9);">${app.name}</span>
                `;
                desktop.appendChild(deskIcon);

                const startIcon = document.createElement('div');
                startIcon.className = 'flex flex-col items-center justify-center cursor-pointer hover:bg-black/5 p-3 rounded-xl transition-colors group active:scale-95';
                startIcon.onclick = () => openApp(appId);
                startIcon.innerHTML = `
                    <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-sm border border-gray-200 group-hover:shadow-md transition-shadow mb-2">
                        <i class="${app.icon} ${app.color} text-2xl"></i>
                    </div>
                    <span class="text-gray-800 text-[11px] text-center font-medium truncate w-full">${app.name}</span>
                `;
                startGrid.appendChild(startIcon);
            });

            setTimeout(() => openApp('about'), 600);
        }

        // Lumenis Space Agent Initialization
        function initLumenisSpace(appId) {
            const container = document.getElementById('lumenis-canvas-container');
            if (!container || window.lumenisSpaceInitialized) return;

            // Load Three.js if not already loaded
            if (typeof THREE === 'undefined') {
                const script = document.createElement('script');
                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
                script.onload = () => startLumenisSpace(container);
                document.head.appendChild(script);
            } else {
                startLumenisSpace(container);
            }

            window.lumenisSpaceInitialized = true;
        }

        function startLumenisSpace(container) {
            let scene, camera, renderer;
            let raccoonCore, anchor = null, mode = "orbit", t = 0;
            let raccoons = [], nodes = [], links = [];

            function init() {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
                camera.position.z = 6;

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.offsetWidth, container.offsetHeight);
                container.appendChild(renderer.domElement);

                const core = new THREE.Mesh(
                    new THREE.SphereGeometry(1, 32, 32),
                    new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true })
                );
                scene.add(core);

                raccoonCore = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                scene.add(raccoonCore);

                createRaccoon(0xffffff, "explorer");
                createRaccoon(0xffaa00, "executor");
                createRaccoon(0x00ffcc, "critic");
                createNode(new THREE.Vector3(2, 1, 0), "boot node");

                window.addEventListener("resize", () => {
                    if (!container.offsetWidth) return;
                    camera.aspect = container.offsetWidth / container.offsetHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.offsetWidth, container.offsetHeight);
                });
            }

            function createNode(pos, label) {
                const node = {
                    pos: pos.clone(), label, memory: [],
                    mesh: new THREE.Mesh(
                        new THREE.SphereGeometry(0.12, 12, 12),
                        new THREE.MeshBasicMaterial({ color: 0x66ffcc })
                    )
                };
                node.mesh.position.copy(pos);
                scene.add(node.mesh);
                nodes.push(node);
                return node;
            }

            function connectNodes(a, b) {
                const line = new THREE.Line(
                    new THREE.BufferGeometry().setFromPoints([a.pos, b.pos]),
                    new THREE.LineBasicMaterial({ color: 0x003333 })
                );
                scene.add(line);
                links.push(line);
            }

            function createRaccoon(color, role) {
                const r = new THREE.Mesh(
                    new THREE.SphereGeometry(0.18, 16, 16),
                    new THREE.MeshBasicMaterial({ color })
                );
                r.role = role;
                r.target = null;
                r.memory = [];
                scene.add(r);
                raccoons.push(r);
            }

            function updateRaccoons() {
                raccoons.forEach(r => {
                    if (r.role === "explorer") {
                        if (!r.target || Math.random() < 0.01) {
                            r.target = nodes[Math.floor(Math.random() * nodes.length)];
                        }
                    }
                    if (r.role === "executor") {
                        r.target = nodes.find(n => n.memory.length < 2) || nodes[0];
                    }
                    if (r.role === "critic") {
                        r.target = nodes.reduce((a, b) => (b.memory.length > a.memory.length ? b : a), nodes[0]);
                    }
                    if (r.target) {
                        r.position.lerp(r.target.pos, 0.05);
                        if (r.position.distanceTo(r.target.pos) < 0.1) {
                            r.target.memory.push({ role: r.role, time: Date.now() });
                            r.memory.push(r.target.label);
                        }
                    } else {
                        t += 0.002;
                        r.position.x = Math.cos(t) * 2;
                        r.position.y = Math.sin(t) * 2;
                    }
                });
            }

            function updateGraph() {
                if (Math.random() < 0.01) {
                    const n = createNode(
                        new THREE.Vector3(
                            (Math.random() - 0.5) * 4,
                            (Math.random() - 0.5) * 3,
                            (Math.random() - 0.5) * 2
                        ),
                        "node_" + Math.floor(Math.random() * 999)
                    );
                    if (nodes.length > 1) {
                        connectNodes(n, nodes[Math.floor(Math.random() * nodes.length)]);
                    }
                }
            }

            function updateCore() {
                t += 0.01;
                if (mode === "orbit") {
                    raccoonCore.position.x = Math.cos(t) * 2;
                    raccoonCore.position.y = Math.sin(t) * 2;
                }
                if (mode === "travel" && anchor) {
                    raccoonCore.position.lerp(anchor.position, 0.05);
                    if (raccoonCore.position.distanceTo(anchor.position) < 0.1) {
                        mode = "attach";
                        document.getElementById("lumenis-mode").innerText = "ATTACH";
                    }
                }
                if (mode === "attach" && anchor) {
                    raccoonCore.position.copy(anchor.position);
                }
            }

            function animate() {
                requestAnimationFrame(animate);
                updateRaccoons();
                updateGraph();
                updateCore();
                renderer.render(scene, camera);
            }

            function createAnchor(pos) {
                const a = new THREE.Mesh(
                    new THREE.SphereGeometry(0.1, 12, 12),
                    new THREE.MeshBasicMaterial({ color: 0x66ffcc })
                );
                a.position.copy(pos);
                scene.add(a);
                return a;
            }

            document.getElementById('lumenis-open-btn').onclick = () => {
                if (!anchor) anchor = createAnchor(new THREE.Vector3(2, 1, 0));
                mode = "travel";
                document.getElementById("lumenis-mode").innerText = "TRAVEL";
            };

            document.getElementById('lumenis-close-btn').onclick = () => {
                if (anchor) scene.remove(anchor);
                anchor = null;
                mode = "orbit";
                document.getElementById("lumenis-mode").innerText = "ORBIT";
            };

            init();
            animate();
        }

        window.onload = initOS;
    </script>
    <script>
        // Breathing desktop: turns the CSS breathing on or off and remembers the
        // choice on this device. Default is on, unless the device asks for reduced motion.
        (function () {
            var KEY = 'o2_breathe';
            function wanted() {
                var v = null;
                try { v = localStorage.getItem(KEY); } catch (e) {}
                if (v === 'on') return true;
                if (v === 'off') return false;
                return !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            }
            function apply(on) {
                document.body.classList.toggle('o2-breathe', on);
                var b = document.getElementById('o2-breathe-btn');
                if (b) {
                    b.setAttribute('aria-pressed', on ? 'true' : 'false');
                    b.title = on ? 'Breathing icons: on (tap to turn off)' : 'Breathing icons: off (tap to turn on)';
                    b.style.opacity = on ? '1' : '0.45';
                }
            }
            window.o2ToggleBreathe = function () {
                var on = !document.body.classList.contains('o2-breathe');
                try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {}
                apply(on);
            };
            apply(wanted());
            // Taskbar buttons are rebuilt on every change; keep their breath on the clock.
            var tb = document.getElementById('taskbar-apps');
            if (tb && window.MutationObserver) {
                new MutationObserver(function () {
                    tb.style.setProperty('--o2-sync', (-((performance.now() / 1000) % 7.6)).toFixed(2) + 's');
                }).observe(tb, { childList: true });
            }
        })();
    </script>
