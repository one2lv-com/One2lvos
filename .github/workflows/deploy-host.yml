name: One2lvOS Persistent Host Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-host
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment files
        run: |
          test -f docker-compose.yml
          test -f core.Dockerfile
          test -f deploy/Dockerfile.gateway
          test -f deploy/nginx.conf
          test -f deploy/host-deploy.sh
          python - <<'PY'
          import pathlib
          for p in ["core_service.py"]:
              compile(pathlib.Path(p).read_text(), p, "exec")
          PY

      - name: Install SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing production secret DEPLOY_SSH_KEY"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing production secret DEPLOY_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy main to Docker host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing production secret DEPLOY_HOST"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing production secret DEPLOY_USER"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "Missing production secret DEPLOY_PATH"; exit 1; }
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "ONE2LV_DEPLOY_DIR='$DEPLOY_PATH' ONE2LV_BRANCH='main' bash -s" < deploy/host-deploy.sh

      - name: Verify public service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose ps && curl -fsS http://127.0.0.1:${ONE2LV_PORT:-8080}/health"
