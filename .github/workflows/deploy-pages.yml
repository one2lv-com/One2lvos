name: One2lvOS Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify core boot
        run: |
          chmod +x install.sh boot.sh 2>/dev/null || true
          python -m py_compile unified_os.py
          test -f One2lvOS/index.html
          test -f One2lvOS/manifest.json

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a One2lvOS/. _site/
          touch _site/.nojekyll
          echo "One2lvOS Pages build: ${GITHUB_SHA}" > _site/BUILD.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
