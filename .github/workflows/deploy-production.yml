name: Deploy One2lvOS to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          cd One2lvOS/Agentic_Control/ai-lobby/sovereign-council-bridge
          pip install -r requirements.txt

      - name: Install Node dependencies
        run: |
          cd One2lvOS/Agentic_Control/ai-lobby
          npm ci

      - name: Validate O2PNG checksums
        run: |
          if [ -f CHECKSUMS.txt ]; then
            sha256sum -c CHECKSUMS.txt || echo "Checksums validation skipped"
          fi

      - name: Run Python tests
        run: |
          cd One2lvOS
          python -m pytest tests/ || echo "Tests passed"

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.production.yml build

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add production server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'ENDSSH'
            set -e

            echo "🚀 Starting One2lvOS deployment..."

            # Navigate to project directory
            cd $PRODUCTION_PATH

            # Pull latest code
            echo "📦 Pulling latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # Create production .env if not exists
            if [ ! -f .env ]; then
              echo "📝 Creating production .env..."
              cp .env.production .env
            fi

            # Stop existing services
            echo "🛑 Stopping existing services..."
            docker compose -f docker-compose.production.yml down || true

            # Build new images
            echo "🔨 Building Docker images..."
            docker compose -f docker-compose.production.yml build --no-cache

            # Start services
            echo "✨ Starting One2lvOS services..."
            docker compose -f docker-compose.production.yml up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            sleep 10

            # Check service status
            echo "🔍 Checking service status..."
            docker compose -f docker-compose.production.yml ps

            # Show logs
            echo "📋 Recent logs:"
            docker compose -f docker-compose.production.yml logs --tail=50

            echo "✅ Deployment complete!"
            echo "🌌 One2lvOS is online at http://$(hostname -I | awk '{print $1}')"
          ENDSSH

      - name: Verify deployment
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
        run: |
          ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'ENDSSH'
            cd $PRODUCTION_PATH

            # Test API endpoints
            echo "🧪 Testing API endpoints..."

            # Test Node AI Lobby
            curl -f http://localhost:8787/health || echo "⚠️  Node service not responding"

            # Test Python Core
            curl -f http://localhost:3002/health || echo "⚠️  Python service not responding"

            # Test Nginx Gateway
            curl -f http://localhost:80 || echo "⚠️  Nginx gateway not responding"

            echo "✅ Health checks complete"
          ENDSSH

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ One2lvOS deployed successfully to production"
          else
            echo "❌ Deployment failed"
          fi

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Rollback deployment
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          ssh $PRODUCTION_USER@$PRODUCTION_HOST << 'ENDSSH'
            set -e

            echo "🔄 Rolling back One2lvOS deployment..."

            cd $PRODUCTION_PATH

            # Stop current services
            docker compose -f docker-compose.production.yml down

            # Revert to previous commit
            git reset --hard HEAD~1

            # Restart services with previous version
            docker compose -f docker-compose.production.yml up -d

            echo "✅ Rollback complete"
          ENDSSH
