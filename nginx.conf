user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;

    # Upstream servers
    upstream node_ai_lobby {
        least_conn;
        server one2lvos-node:8787 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream python_core {
        least_conn;
        server one2lvos-python:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Main server block
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # =================================================================
        # API ROUTES
        # =================================================================

        # Node AI Lobby API - /api/ai-lobby/*
        location /api/ai-lobby/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://node_ai_lobby/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Python Core API - /api/core/*
        location /api/core/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://python_core/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # WebSocket support for AI Lobby
        location /ws {
            proxy_pass http://node_ai_lobby/ws;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # =================================================================
        # STATIC FRONTEND - One2lvOS UI
        # =================================================================

        # Main application
        location / {
            limit_req zone=general_limit burst=100 nodelay;

            try_files $uri $uri/ /index.html;

            # Cache static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Infinity Glasses spatial desktop
        location /Infinity_Glasses/ {
            alias /usr/share/nginx/html/Infinity_Glasses/;
            try_files $uri $uri/ /Infinity_Glasses/index.html;
        }

        # Aetherix master terminal
        location /Aetherix/ {
            alias /usr/share/nginx/html/Aetherix/;
            try_files $uri $uri/ /Aetherix/index.html;
        }

        # Lumenis cosmic gaming
        location /Lumenis/ {
            alias /usr/share/nginx/html/Lumenis/;
            try_files $uri $uri/ /Lumenis/index.html;
        }

        # Agentic Control AI Lobby
        location /Agentic_Control/ {
            alias /usr/share/nginx/html/Agentic_Control/;
            try_files $uri $uri/ /Agentic_Control/index.html;
        }

        # =================================================================
        # O2PNG SNAPSHOTS & RECOVERY
        # =================================================================

        location /snapshots/ {
            alias /usr/share/nginx/html/snapshots/;
            autoindex on;
            autoindex_exact_size off;
            autoindex_localtime on;

            # Only allow GET for snapshots
            limit_except GET {
                deny all;
            }
        }

        # =================================================================
        # ERROR PAGES
        # =================================================================

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
