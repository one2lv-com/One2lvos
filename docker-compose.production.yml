version: '3.8'

services:
  # ============================================================================
  # NGINX GATEWAY - Routes all traffic
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: one2lvos-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./One2lvOS:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - node-ai-lobby
      - python-core
    networks:
      - one2lvos-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # NODE AI LOBBY - Port 8787
  # ============================================================================
  node-ai-lobby:
    build:
      context: ./One2lvOS/Agentic_Control/ai-lobby
      dockerfile: Dockerfile
    container_name: one2lvos-node
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - ASTRA_DB_API_ENDPOINT=${ASTRA_DB_API_ENDPOINT}
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN}
      - ASTRA_DB_KEYSPACE=${ASTRA_DB_KEYSPACE}
      - ASTRA_NVIDIA_MODEL=${ASTRA_NVIDIA_MODEL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_KEY_SECONDARY=${NVIDIA_API_KEY_SECONDARY}
      - NVIDIA_API_KEY_NEMOTRON_SUPER=${NVIDIA_API_KEY_NEMOTRON_SUPER}
      - NVIDIA_API_KEY_MINIMAX=${NVIDIA_API_KEY_MINIMAX}
      - NVIDIA_API_KEY_STEPFUN=${NVIDIA_API_KEY_STEPFUN}
      - NVIDIA_API_KEY_KIMI=${NVIDIA_API_KEY_KIMI}
      - NVIDIA_API_ENDPOINT=${NVIDIA_API_ENDPOINT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CLIENT_ID=${GEMINI_CLIENT_ID}
      - GEMINI_AGENT_NAME=${GEMINI_AGENT_NAME}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - PYTHON_API_URL=http://python-core:3002
    volumes:
      - ./One2lvOS/Agentic_Control/ai-lobby:/app
      - /app/node_modules
      - ./logs/node:/app/logs
      - ./data/node:/app/data
    networks:
      - one2lvos-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # PYTHON CORE - Port 3002 (FastAPI Sovereign Council)
  # ============================================================================
  python-core:
    build:
      context: ./One2lvOS/Agentic_Control/ai-lobby/sovereign-council-bridge
      dockerfile: Dockerfile
    container_name: one2lvos-python
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PYTHON_ENV=production
      - PORT=3002
      - ASTRA_DB_API_ENDPOINT=${ASTRA_DB_API_ENDPOINT}
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN}
      - ASTRA_DB_KEYSPACE=${ASTRA_DB_KEYSPACE}
      - ASTRA_NVIDIA_MODEL=${ASTRA_NVIDIA_MODEL}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_API_KEY_SECONDARY=${NVIDIA_API_KEY_SECONDARY}
      - NVIDIA_API_KEY_NEMOTRON_SUPER=${NVIDIA_API_KEY_NEMOTRON_SUPER}
      - NVIDIA_API_ENDPOINT=${NVIDIA_API_ENDPOINT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CLIENT_ID=${GEMINI_CLIENT_ID}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - MATON_API_KEY=${MATON_API_KEY}
    volumes:
      - ./One2lvOS/Agentic_Control/ai-lobby/sovereign-council-bridge:/app
      - ./logs/python:/app/logs
      - ./data/python:/app/data
      - ./snapshots:/app/snapshots
    networks:
      - one2lvos-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:3002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # ASTRA DB INITIALIZER - Runs once to set up collections
  # ============================================================================
  astra-init:
    build:
      context: .
      dockerfile: Dockerfile.astra-init
    container_name: one2lvos-astra-init
    restart: "no"
    environment:
      - ASTRA_DB_API_ENDPOINT=${ASTRA_DB_API_ENDPOINT}
      - ASTRA_DB_APPLICATION_TOKEN=${ASTRA_DB_APPLICATION_TOKEN}
      - ASTRA_DB_KEYSPACE=${ASTRA_DB_KEYSPACE}
    volumes:
      - ./astra-db-setup.py:/app/astra-db-setup.py:ro
      - ./logs/astra:/app/logs
    networks:
      - one2lvos-network
    depends_on:
      - python-core
      - node-ai-lobby

  # ============================================================================
  # WATCHTOWER - Auto-update containers
  # ============================================================================
  watchtower:
    image: containrrr/watchtower
    container_name: one2lvos-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
    networks:
      - one2lvos-network

networks:
  one2lvos-network:
    driver: bridge
    name: one2lvos-network

volumes:
  node-data:
    name: one2lvos-node-data
  python-data:
    name: one2lvos-python-data
  nginx-logs:
    name: one2lvos-nginx-logs
  snapshots:
    name: one2lvos-snapshots
