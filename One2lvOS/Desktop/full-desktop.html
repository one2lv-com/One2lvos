<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One2lvOS - Complete Desktop Environment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #00ffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Aurora Background */
        #aurora-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
        }

        /* Main Container */
        #desktop-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* Top System Bar */
        #system-bar {
            height: 40px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 2px solid #00ffff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            z-index: 2000;
            box-shadow: 0 2px 20px rgba(0, 255, 255, 0.3);
        }

        .system-logo {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pulse {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #00ff00; }
            50% { opacity: 0.5; }
        }

        .system-stats {
            margin-left: auto;
            display: flex;
            gap: 20px;
            font-size: 11px;
            color: #00ff00;
        }

        .stat-item { display: flex; align-items: center; gap: 4px; }

        /* Desktop Grid */
        #desktop-grid {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* Sidebar Dock */
        #dock {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 16px;
            padding: 12px 8px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 255, 255, 0.4);
            z-index: 1500;
        }

        .dock-icon {
            width: 56px;
            height: 56px;
            margin: 8px 0;
            background: linear-gradient(135deg, #001a33, #003366);
            border: 2px solid #00ffff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .dock-icon:hover {
            background: linear-gradient(135deg, #0066cc, #00ffff);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        .dock-label {
            position: absolute;
            left: 70px;
            background: rgba(0, 0, 0, 0.95);
            padding: 6px 12px;
            border-radius: 6px;
            white-space: nowrap;
            font-size: 11px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border: 1px solid #00ffff;
        }

        .dock-icon:hover .dock-label {
            opacity: 1;
        }

        /* Windows */
        .window {
            position: absolute;
            background: rgba(10, 10, 30, 0.95);
            border: 2px solid #00ffff;
            border-radius: 12px;
            box-shadow: 0 12px 48px rgba(0, 255, 255, 0.4);
            backdrop-filter: blur(15px);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 100;
        }

        .window.active {
            display: flex;
        }

        .window.maximized {
            top: 40px !important;
            left: 0 !important;
            width: 100% !important;
            height: calc(100% - 88px) !important;
            border-radius: 0;
        }

        .window-titlebar {
            height: 40px;
            background: linear-gradient(135deg, #001a33, #003366);
            border-bottom: 1px solid #00ffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            cursor: move;
            user-select: none;
        }

        .window-title {
            color: #00ffff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .window-controls {
            display: flex;
            gap: 6px;
        }

        .window-control {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .window-control.minimize { background: #ffaa00; }
        .window-control.maximize { background: #00ff00; }
        .window-control.close { background: #ff0000; }

        .window-control:hover {
            transform: scale(1.15);
            box-shadow: 0 0 12px currentColor;
        }

        .window-content {
            flex: 1;
            overflow: auto;
            padding: 16px;
            position: relative;
        }

        /* Taskbar */
        #taskbar {
            height: 48px;
            background: rgba(0, 0, 0, 0.95);
            border-top: 2px solid #00ffff;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 8px;
            z-index: 2000;
            box-shadow: 0 -4px 20px rgba(0, 255, 255, 0.3);
        }

        .taskbar-item {
            height: 36px;
            padding: 0 16px;
            background: linear-gradient(135deg, #001a33, #003366);
            border: 1px solid #00ffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .taskbar-item:hover, .taskbar-item.active {
            background: linear-gradient(135deg, #003366, #0066cc);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        /* Terminal Styles */
        .terminal {
            background: #000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            padding: 12px;
            height: 100%;
            overflow-y: auto;
            line-height: 1.4;
        }

        .terminal-line {
            margin: 2px 0;
            white-space: pre-wrap;
        }

        .terminal-prompt { color: #00ffff; }
        .terminal-error { color: #ff0000; }
        .terminal-success { color: #00ff00; }
        .terminal-warning { color: #ffff00; }

        .terminal-input-container {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }

        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #00ff00;
            font-family: inherit;
            font-size: inherit;
        }

        /* Galaxy Renderer */
        .galaxy-container {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }

        #galaxy-canvas {
            width: 100%;
            height: 100%;
        }

        .galaxy-info {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.8);
            padding: 16px;
            border: 1px solid #00ffff;
            border-radius: 8px;
            font-size: 12px;
        }

        /* AI Chat */
        .ai-chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .ai-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ai-message {
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
        }

        .ai-message.user {
            background: rgba(0, 102, 204, 0.3);
            align-self: flex-end;
            border: 1px solid #0066cc;
        }

        .ai-message.assistant {
            background: rgba(0, 255, 255, 0.2);
            align-self: flex-start;
            border: 1px solid #00ffff;
        }

        .ai-input-area {
            height: 70px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid #00ffff;
            display: flex;
            padding: 12px;
            gap: 12px;
        }

        .ai-input {
            flex: 1;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
            resize: none;
        }

        .ai-send-btn {
            background: linear-gradient(135deg, #0066cc, #00ffff);
            border: none;
            color: #000;
            padding: 0 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }

        .ai-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }

        /* System Monitor */
        .monitor-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 16px;
        }

        .monitor-card {
            background: rgba(0, 50, 100, 0.3);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 16px;
        }

        .monitor-card h3 {
            color: #00ffff;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .monitor-stat {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 12px;
        }

        .stat-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 6px;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ffff, #0066cc);
            transition: width 0.5s;
        }

        /* File Browser */
        .file-browser {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .file-toolbar {
            height: 44px;
            background: rgba(0, 50, 100, 0.3);
            border-bottom: 1px solid #00ffff;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }

        .file-toolbar button {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }

        .file-toolbar button:hover {
            background: rgba(0, 255, 255, 0.4);
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .file-item {
            padding: 10px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-item:hover {
            background: rgba(0, 255, 255, 0.1);
        }

        /* Web Browser */
        .browser-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .browser-toolbar {
            height: 44px;
            background: rgba(0, 50, 100, 0.3);
            border-bottom: 1px solid #00ffff;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
        }

        .browser-toolbar button {
            background: rgba(0, 255, 255, 0.2);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .browser-address {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            outline: none;
        }

        .browser-frame {
            flex: 1;
            border: none;
            background: #fff;
        }

        /* Reactor Core */
        .reactor-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding: 16px;
        }

        .reactor-module {
            background: rgba(0, 50, 100, 0.3);
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s;
        }

        .reactor-module:hover {
            border-color: #00ff00;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .reactor-status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 0 auto 8px;
            animation: pulse 2s infinite;
        }

        .reactor-status.online { background: #00ff00; }
        .reactor-status.warning { background: #ffaa00; }
        .reactor-status.offline { background: #ff0000; }

        /* Notification */
        #notification-container {
            position: fixed;
            top: 60px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
        }

        .notification {
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ffff;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.3);
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Context Menu */
        #context-menu {
            position: fixed;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #00ffff;
            border-radius: 6px;
            padding: 4px 0;
            min-width: 180px;
            z-index: 10000;
            display: none;
            box-shadow: 0 4px 16px rgba(0, 255, 255, 0.4);
        }

        .context-menu-item {
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 12px;
        }

        .context-menu-item:hover {
            background: rgba(0, 255, 255, 0.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: #00ffff;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ddaa;
        }
    </style>
</head>
<body>
    <canvas id="aurora-canvas"></canvas>

    <div id="desktop-container">
        <!-- System Bar -->
        <div id="system-bar">
            <div class="system-logo">
                <div class="status-pulse"></div>
                ∞ ONE2LVOS v1.0
            </div>
            <div class="system-stats">
                <div class="stat-item">CPU: <span id="cpu-usage">0%</span></div>
                <div class="stat-item">RAM: <span id="ram-usage">0MB</span></div>
                <div class="stat-item">Agents: <span id="agent-count">0</span></div>
                <div class="stat-item" id="clock"></div>
            </div>
        </div>

        <!-- Desktop Grid with Dock -->
        <div id="desktop-grid">
            <!-- Dock -->
            <div id="dock">
                <div class="dock-icon" onclick="One2lvOS.openWindow('infinity-glass')">
                    🌠
                    <div class="dock-label">Infinity Glass</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('terminal')">
                    ⌨️
                    <div class="dock-label">Terminal</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('ai-lobby')">
                    🧠
                    <div class="dock-label">AI Lobby</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('files')">
                    📁
                    <div class="dock-label">Files</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('browser')">
                    🌐
                    <div class="dock-label">Browser</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('system-monitor')">
                    📊
                    <div class="dock-label">System Monitor</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('reactor')">
                    ⚛️
                    <div class="dock-label">Reactor Core</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('jwst')">
                    🔭
                    <div class="dock-label">JWST Gallery</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('symbolic')">
                    ∫
                    <div class="dock-label">Symbolic Engine</div>
                </div>
                <div class="dock-icon" onclick="One2lvOS.openWindow('voice')">
                    🎤
                    <div class="dock-label">Voice Agent</div>
                </div>
            </div>

            <!-- Windows Container -->
            <div id="windows"></div>
        </div>

        <!-- Taskbar -->
        <div id="taskbar"></div>
    </div>

    <!-- Notifications -->
    <div id="notification-container"></div>

    <!-- Context Menu -->
    <div id="context-menu"></div>

    <!-- Load External Modules -->
    <script src="agent.js"></script>
    <script src="terminal.js"></script>

    <script>
        // One2lvOS Desktop Manager
        const One2lvOS = {
            windows: {},
            nextZIndex: 100,
            activeWindow: null,

            init() {
                this.setupAurora();
                this.setupSystemStats();
                this.setupContextMenu();
                this.initializeModules();
                this.showWelcome();
            },

            setupAurora() {
                const canvas = document.getElementById('aurora-canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                let time = 0;
                const animate = () => {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(0, ${150 + i * 50}, ${200 + i * 50}, 0.3)`;
                        ctx.lineWidth = 2;

                        for (let x = 0; x < canvas.width; x += 10) {
                            const y = canvas.height / 2 +
                                     Math.sin((x + time * 2 + i * 100) * 0.01) * 50 +
                                     Math.sin((x + time * 3 + i * 150) * 0.005) * 30;
                            if (x === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }

                    time += 1;
                    requestAnimationFrame(animate);
                };
                animate();

                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            },

            setupSystemStats() {
                setInterval(() => {
                    document.getElementById('cpu-usage').textContent =
                        Math.floor(Math.random() * 30 + 10) + '%';
                    document.getElementById('ram-usage').textContent =
                        Math.floor(Math.random() * 500 + 4000) + 'MB';
                    document.getElementById('agent-count').textContent =
                        window.AgentManager ? window.AgentManager.agents.size : 0;
                }, 3000);

                setInterval(() => {
                    const now = new Date();
                    document.getElementById('clock').textContent =
                        now.toLocaleTimeString('en-US', { hour12: false });
                }, 1000);
            },

            setupContextMenu() {
                const menu = document.getElementById('context-menu');

                document.addEventListener('contextmenu', e => {
                    if (e.target.closest('.window')) return;
                    e.preventDefault();
                    menu.innerHTML = `
                        <div class="context-menu-item" onclick="One2lvOS.openWindow('terminal')">🖥️ Open Terminal</div>
                        <div class="context-menu-item" onclick="One2lvOS.openWindow('ai-lobby')">🧠 Open AI Lobby</div>
                        <div class="context-menu-item" onclick="One2lvOS.openWindow('files')">📁 Open Files</div>
                        <div class="context-menu-item" onclick="One2lvOS.openWindow('browser')">🌐 Open Browser</div>
                        <div class="context-menu-item" onclick="One2lvOS.openWindow('system-monitor')">📊 System Monitor</div>
                        <div class="context-menu-item" onclick="One2lvOS.notify('Refresh', 'System refreshed')">🔄 Refresh</div>
                    `;
                    menu.style.left = e.pageX + 'px';
                    menu.style.top = e.pageY + 'px';
                    menu.style.display = 'block';
                });

                document.addEventListener('click', e => {
                    if (!e.target.closest('#context-menu')) {
                        menu.style.display = 'none';
                    }
                });
            },

            initializeModules() {
                if (window.AgentManager) {
                    window.AgentManager.initialize();
                    this.notify('AgentManager', 'Initialized with ' + window.AgentManager.agents.size + ' agents');
                }
            },

            showWelcome() {
                this.notify('Welcome', 'One2lvOS Desktop Environment Loaded');
                setTimeout(() => {
                    this.openWindow('infinity-glass');
                }, 1000);
            },

            createWindow(id, title, content, width = 900, height = 600) {
                if (this.windows[id]) {
                    this.focusWindow(id);
                    return this.windows[id];
                }

                const win = document.createElement('div');
                win.className = 'window active';
                win.id = 'win-' + id;
                win.style.width = width + 'px';
                win.style.height = height + 'px';
                win.style.left = (window.innerWidth / 2 - width / 2 + Math.random() * 60 - 30) + 'px';
                win.style.top = (window.innerHeight / 2 - height / 2 + Math.random() * 60 - 30) + 'px';
                win.style.zIndex = this.nextZIndex++;

                win.innerHTML = `
                    <div class="window-titlebar">
                        <div class="window-title">${title}</div>
                        <div class="window-controls">
                            <button class="window-control minimize">−</button>
                            <button class="window-control maximize">□</button>
                            <button class="window-control close">×</button>
                        </div>
                    </div>
                    <div class="window-content">${content}</div>
                `;

                document.getElementById('windows').appendChild(win);
                this.attachWindowBehavior(win, id);
                this.windows[id] = win;
                this.activeWindow = id;
                this.addTaskbarItem(id, title);

                return win;
            },

            attachWindowBehavior(win, id) {
                const titlebar = win.querySelector('.window-titlebar');

                // Dragging
                let isDragging = false, initialX, initialY, currentX, currentY;

                titlebar.addEventListener('mousedown', e => {
                    if (e.target.closest('.window-control')) return;
                    isDragging = true;
                    this.focusWindow(id);
                    initialX = e.clientX - win.offsetLeft;
                    initialY = e.clientY - win.offsetTop;
                    win.style.cursor = 'grabbing';
                });

                document.addEventListener('mousemove', e => {
                    if (!isDragging) return;
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    if (!win.classList.contains('maximized')) {
                        win.style.left = currentX + 'px';
                        win.style.top = currentY + 'px';
                    }
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                    win.style.cursor = 'default';
                });

                // Window controls
                win.querySelector('.minimize').onclick = () => {
                    win.classList.remove('active');
                    document.querySelector(`[data-window-id="${id}"]`).classList.remove('active');
                };

                win.querySelector('.maximize').onclick = () => {
                    win.classList.toggle('maximized');
                };

                    win.remove();
                    delete this.windows[id];

                Object.values(this.windows).forEach(w => w.style.zIndex = 100);

                    this.windows[id].classList.add('active');

                    document.querySelectorAll('.taskbar-item').forEach(item => {

                item.onclick = () => {

                        item.classList.remove('active');

                const writeLine = (text, className = '') => {
                    const line = document.createElement('div');
                    line.className = 'terminal-line ' + className;

                    output.appendChild(line);
                    output.scrollTop = output.scrollHeight;
                };

                writeLine('One2lvOS v1.0 [Kernel 0.9.4-generic x86_64]', 'terminal-success');
                writeLine('Type "help" for available commands\n');

                const commands = {
                    help: () => 'Available: help, clear, ls, pwd, date, whoami, neofetch, agents, apps, reactor',
                    clear: () => { output.innerHTML = ''; return ''; },
                    ls: () => 'Desktop  Documents  Downloads  Pictures  Videos  Infinity_Glasses  Agentic_Control',
                    pwd: () => '/home/user',
                    date: () => new Date().toString(),
                    whoami: () => 'user',

                    reactor: () => { One2lvOS.openWindow('reactor'); return 'Opening Reactor Core...'; }

            startGalaxy(win) {
                const canvas = win.querySelector('#galaxy-canvas');
                const ctx = canvas.getContext('2d');
                const container = canvas.parentElement;

                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;

                const stars = [];
                for (let i = 0; i < 10247; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 300;
                    stars.push({
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius,
                        z: Math.random() * 500,
                        brightness: Math.random()
                    });
                }

                let rotation = 0;
                const animate = () => {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    const centerX = canvas.width / 2;
                    const centerY = canvas.height / 2;

                    stars.forEach(star => {
                        const rotX = star.x * Math.cos(rotation) - star.y * Math.sin(rotation);
                        const rotY = star.x * Math.sin(rotation) + star.y * Math.cos(rotation);

                        const scale = 200 / (200 + star.z);
                        const x = centerX + rotX * scale;
                        const y = centerY + rotY * scale;
                        const size = scale * 2;

                        ctx.fillStyle = `rgba(0, ${150 + star.brightness * 105}, ${200 + star.brightness * 55}, ${star.brightness})`;
                        ctx.beginPath();
                        ctx.arc(x, y, size, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    rotation += 0.001;
                    const rotDeg = Math.floor((rotation * 180 / Math.PI) % 360);
                    const fpsEl = win.querySelector('#galaxy-fps');
                    const rotEl = win.querySelector('#galaxy-rotation');
                    if (fpsEl) fpsEl.textContent = '60';
                    if (rotEl) rotEl.textContent = rotDeg + '°';

                    requestAnimationFrame(animate);
                };
                animate();
            },

            notify(title, message) {
                const container = document.getElementById('notification-container');
                const notification = document.createElement('div');
                notification.className = 'notification';
                notification.innerHTML = `
                    <div style="font-weight: bold; margin-bottom: 4px;">${title}</div>
                    <div style="font-size: 11px; opacity: 0.8;">${message}</div>
                `;
                container.appendChild(notification);
                setTimeout(() => notification.remove(), 3000);
            }
        };

        // Initialize on load
        window.addEventListener('load', () => {
            One2lvOS.init();
        });
    </script>
</body>
</html>
