<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>One2lvOS</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #boot-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            padding: 20px;
        }

        #boot-log {
            width: 100%;
            max-width: 800px;
            text-align: left;
            line-height: 1.6;
        }

        .boot-line {
            margin: 4px 0;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .boot-success { color: #00ff00; }
        .boot-error { color: #ff0000; }
        .boot-warning { color: #ffff00; }
        .boot-info { color: #00ffff; }

        #aurora-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #desktop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="aurora-canvas"></canvas>

    <div id="boot-screen">
        <div id="boot-log"></div>
    </div>

    <div id="desktop"></div>

    <!-- BIOS -->
    <script src="BIOS/boot.js"></script>
</body>
</html>
